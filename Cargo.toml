[package]
name = "antty"
version = "0.2.27"
edition = "2024"
rust-version = "1.88"
default-run = "antty"
license = "MIT OR Apache-2.0"
description = "Terminal timelines for coding-agent sessions, tool calls, and file changes"
repository = "https://github.com/filipkristofiak/antty"
documentation = "https://github.com/filipkristofiak/antty#docs"
readme = "README.md"
keywords = ["coding-agents", "tui", "gantt", "timeline", "developer-tools"]
categories = ["command-line-utilities", "development-tools", "visualization"]
include = ["src/**", "Cargo.toml", "Cargo.lock", "README.md", "LICENSE-*"]

[dependencies]
anyhow = "1.0.104"
chrono = { version = "0.4.45", features = ["serde"] }
clap = { version = "4.6.7", features = ["derive"] }
crossterm = "0.29.0"
ignore = "0.4.33"
notify = "8.2.0"
ratatui = "0.30.2"
rmp-serde = "1.3.1"
serde = { version = "1.0.229", features = ["derive", "rc"] }
serde_json = "1.0.151"
similar = "3.2.0"
unicode-width = "0.2.2"

[target.'cfg(unix)'.dependencies]
libc = "0.2.189"
