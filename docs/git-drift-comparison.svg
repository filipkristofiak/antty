<svg xmlns="http://www.w3.org/2000/svg" width="920" height="336" viewBox="0 0 920 336" xml:space="preserve" role="img" aria-labelledby="drift-title drift-desc">
<title id="drift-title">Branch drift comparison concept</title>
<desc id="drift-desc">Two pinned commit trees compared by path, including rename candidates and a file to directory change, with agent activity as provenance. Illustrative data, not an implemented screen.</desc>
<style>text { white-space: pre; }</style>
<rect width="920" height="336" fill="#20242c"/>
<g fill="none" stroke="#8690a0"><rect x="4" y="4" width="912" height="328"/><path d="M4 44H916 M4 100H916 M4 236H916 M4 296H916"/></g>
<g fill="#eef0f4" font-family="monospace" font-size="16" style="white-space:pre">
<text x="16" y="28" font-weight="bold">antty  /  compare trees</text>
<text x="16" y="68">A: main @ 4a10e2</text><text x="448" y="68">B: feat/auth @ 9b42c1</text>
<text x="16" y="88" opacity="0.7">Committed trees · pinned endpoints · working changes excluded</text>
<text x="16" y="124" font-weight="bold">PATH / RELATION</text><text x="560" y="124" font-weight="bold">STATE</text><text x="728" y="124" font-weight="bold">ACTIVITY</text>
<text x="16" y="152">src/auth.rs → packages/auth/index.rs</text><text x="560" y="152">rename?</text><text x="728" y="152">Extract auth</text>
<text x="16" y="176">packages/auth/token.rs</text><text x="560" y="176">only B</text><text x="728" y="176">Extract auth</text>
<text x="16" y="200" font-weight="bold">&gt; config</text><text x="560" y="200" font-weight="bold">file → dir</text><text x="728" y="200">Config split</text>
<text x="16" y="224">Cargo.toml</text><text x="560" y="224">content</text><text x="728" y="224">Extract auth</text>
<text x="16" y="260">A: config [file]</text><text x="448" y="260">B: config/settings.toml [child]</text>
<text x="16" y="284" opacity="0.7">Different types remain distinct; neither is flattened into the other.</text>
<text x="16" y="320">Enter inspect pair  ·  activity opens recorded events  ·  q returns to Gantt</text>
</g>
</svg>
